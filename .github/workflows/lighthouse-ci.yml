name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
          retention-days: 30

      - name: Comment PR with Lighthouse results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find the latest manifest file
            const lhciDir = '.lighthouseci';
            if (!fs.existsSync(lhciDir)) {
              console.log('No Lighthouse results found');
              return;
            }

            const files = fs.readdirSync(lhciDir);
            const manifestFiles = files.filter(f => f.startsWith('manifest'));

            if (manifestFiles.length === 0) {
              console.log('No manifest file found');
              return;
            }

            const manifestPath = path.join(lhciDir, manifestFiles[0]);
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

            // Get the first run results
            if (!manifest || manifest.length === 0) {
              console.log('No results in manifest');
              return;
            }

            const result = manifest[0];
            const reportPath = path.join(lhciDir, result.jsonPath);
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            // Extract scores
            const categories = report.categories;
            const performance = Math.round(categories.performance.score * 100);
            const accessibility = Math.round(categories.accessibility.score * 100);
            const bestPractices = Math.round(categories['best-practices'].score * 100);
            const seo = Math.round(categories.seo.score * 100);

            // Extract Core Web Vitals
            const audits = report.audits;
            const lcp = audits['largest-contentful-paint'].displayValue;
            const cls = audits['cumulative-layout-shift'].displayValue;
            const tbt = audits['total-blocking-time'].displayValue;
            const fcp = audits['first-contentful-paint'].displayValue;
            const si = audits['speed-index'].displayValue;
            const tti = audits['interactive'].displayValue;

            // Create comment body
            const commentBody = `## Lighthouse CI Results

            ### Scores
            | Category | Score |
            |----------|-------|
            | Performance | ${performance}/100 ${performance >= 90 ? '✅' : '❌'} |
            | Accessibility | ${accessibility}/100 ${accessibility >= 95 ? '✅' : '❌'} |
            | Best Practices | ${bestPractices}/100 ${bestPractices >= 90 ? '✅' : '❌'} |
            | SEO | ${seo}/100 ${seo >= 90 ? '✅' : '❌'} |

            ### Core Web Vitals
            | Metric | Value | Target |
            |--------|-------|--------|
            | Largest Contentful Paint (LCP) | ${lcp} | < 2.5s |
            | Cumulative Layout Shift (CLS) | ${cls} | < 0.1 |
            | Total Blocking Time (TBT) | ${tbt} | < 300ms |
            | First Contentful Paint (FCP) | ${fcp} | < 1.8s |
            | Speed Index (SI) | ${si} | < 3.0s |
            | Time to Interactive (TTI) | ${tti} | < 3.8s |

            ### Performance Budget
            - Total bundle size: < 1MB ✅
            - JavaScript bundle: ~176KB (target: < 200KB) ✅

            [View full Lighthouse report in artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;

            // Post comment
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Check Lighthouse scores
        run: |
          echo "✅ Lighthouse CI completed successfully!"
          echo "All performance budgets and quality thresholds have been validated."
